name: test configure (offline smoke)

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"
      - "trae/**"
      - "stable"
      - "latest"
    paths:
      - "scripts/configure"
      - "scripts/pins.env"
      - "scripts/patches/**"
      - ".github/workflows/test-configure.yml"

jobs:
  smoke:
    name: offline smoke (help / dry-run / arg validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Build mock kernel tree
        run: |
          set -e
          mkdir -p /tmp/mock/kernel_platform/common/arch/arm64/configs
          printf 'VERSION = 6\nPATCHLEVEL = 6\nSUBLEVEL = 89\nNAME = mock\n' \
            > /tmp/mock/kernel_platform/common/Makefile
          printf 'CONFIG_ZRAM=m\nCONFIG_FOO=y\n' \
            > /tmp/mock/kernel_platform/common/arch/arm64/configs/gki_defconfig
          cp "$GITHUB_WORKSPACE/repo/scripts/configure" /tmp/mock/configure
          mkdir -p /tmp/mock/patches
          cp "$GITHUB_WORKSPACE"/repo/scripts/patches/*.patch /tmp/mock/patches/ 2>/dev/null || true

      - name: --help works
        run: python3 /tmp/mock/configure --help > /dev/null

      - name: dry-run works, plans pinned sources, makes no changes
        run: |
          cd /tmp/mock
          python3 configure --ksu-variant RESUKISU --ksu-branch default --susfs --zram LZ4 --kpm --dry-run | tee /tmp/dry.log
          grep -q "dry-run" /tmp/dry.log
          grep -q "susfs4ksu" /tmp/dry.log
          grep -q "89-susfs-fixup.patch" /tmp/dry.log
          grep -q "lib-Update-zram-to-1.10.0-6.6.118.patch" /tmp/dry.log
          grep -q "89-zram-lz4-fixup.patch" /tmp/dry.log
          grep -q "KPatch-Next" /tmp/dry.log
          # 容器/运行时配置（与闭源 configure 对账项）必须在 dry-run 计划中出现
          for sym in HEADERS_INSTALL OVERLAY_FS PID_NS DEVTMPFS SYSVIPC IPC_NS POSIX_MQUEUE NF_TABLES; do
            grep -q "CONFIG_${sym}=y" /tmp/dry.log || { echo "FAIL: missing CONFIG_${sym}=y in dry-run plan"; exit 1; }
          done
          # dry-run 不得写入 defconfig
          ! grep -q "configure appended" kernel_platform/common/arch/arm64/configs/gki_defconfig
          ! grep -q "# ---" kernel_platform/common/arch/arm64/configs/gki_defconfig
          echo "DRY-RUN ASSERTIONS PASSED"

      - name: invalid variant is rejected
        run: |
          cd /tmp/mock
          if python3 configure --ksu-variant NOT_A_VARIANT --dry-run; then
            echo "FAIL: invalid variant was accepted"; exit 1
          fi
          echo "ARG VALIDATION PASSED"

      - name: pins.env is parsed
        run: |
          cp "$GITHUB_WORKSPACE/repo/scripts/pins.env" /tmp/mock/pins.env
          cd /tmp/mock
          python3 configure --ksu-variant RESUKISU --susfs --dry-run | tee /tmp/dry2.log
          grep -q "pins loaded" /tmp/dry2.log
          echo "PINS ASSERTIONS PASSED"
